const INK = "#0F172A";

function parseNum(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : 0;
}

function euro(n) {
  return n.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €";
}

function pct(n) {
  return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
}

function median(arr) {
  if (!arr || arr.length === 0) return 0;
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function tierFor(rn) {
  if (rn < 2) return { label: "Faible", color: "#B91C1C" };
  if (rn < 4) return { label: "Modérée", color: "#D97706" };
  if (rn < 6) return { label: "Correcte", color: "#CA8A04" };
  if (rn < 8) return { label: "Bonne", color: "#16A34A" };
  return { label: "Excellente", color: "#15803D" };
}

function normalizeStr(s) {
  return (s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function codeToDept(codeInsee) {
  if (!codeInsee) return null;
  if (codeInsee.startsWith("97") || codeInsee.startsWith("98")) return codeInsee.slice(0, 3);
  return codeInsee.slice(0, 2);
}

// Identique à la version Python (update_prix.py) : même latitude de
// référence, même formule, pour que les cases de grille correspondent.
const REF_LAT_FRANCE = 46.5;
const RESOLUTIONS_SECTEUR = [300, 500, 1000];
function gridId(lat, lon, tailleM) {
  const latDeg = tailleM / 111320;
  const lonDeg = tailleM / (111320 * Math.cos((REF_LAT_FRANCE * Math.PI) / 180));
  return `${Math.floor(lat / latDeg)}_${Math.floor(lon / lonDeg)}`;
}

// Test point-dans-polygone (ray casting) pour détecter le quartier
// administratif parisien correspondant à une adresse (encadrement des loyers).
function pointDansPolygone(lat, lon, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const [loni, lati] = polygon[i];
    const [lonj, latj] = polygon[j];
    const intersect =
      lati > lat !== latj > lat &&
      lon < ((lonj - loni) * (lat - lati)) / (latj - lati) + loni;
    if (intersect) inside = !inside;
  }
  return inside;
}

const EPOQUES_CONSTRUCTION = ["Avant 1946", "1946-1970", "1971-1990", "Apres 1990"];

// Fichier statique généré à partir des Statistiques DVF officielles
// (data.gouv.fr / Etalab, Licence Ouverte), hébergé par l'utilisateur sur GitHub
// (raw.githubusercontent.com gère nativement les en-têtes CORS).

  { key: "bon", label: "Bon état", coef: 1.0 },

];

  { key: "parking", label: "Parking / box", bonus: 0.03, types: ["appartement", "maison", "local"] },
  { key: "exterieur", label: "Terrasse / balcon", bonus: 0.04, types: ["appartement", "maison"] },
  { key: "jardin", label: "Jardin", bonus: 0.055, types: ["maison"] },
  { key: "piscine", label: "Piscine", bonus: 0.045, types: ["maison"] },
  { key: "cave", label: "Cave", bonus: 0.02, types: ["appartement", "maison"] },
  { key: "ascenseur", label: "Ascenseur", bonus: 0.02, types: ["local"] },
  { key: "climatisation", label: "Climatisation", bonus: 0.02, types: ["appartement", "maison", "local"] },
  { key: "vueDegagee", label: "Vue dégagée / sans vis-à-vis", bonus: 0.03, types: ["appartement", "maison"] },
];

// Bonus/malus indicatifs sur prix ET loyer selon la classe DPE (D = neutre).
// "interdit" indique la date à partir de laquelle la location est/sera interdite
// pour cette classe (loi Climat et Résilience), à titre informatif.
const DPE_CLASSES = [
  { key: "A", label: "A", coef: 0.08, interdit: null },
  { key: "B", label: "B", coef: 0.05, interdit: null },
  { key: "C", label: "C", coef: 0.02, interdit: null },
  { key: "D", label: "D", coef: 0, interdit: null },
  { key: "E", label: "E", coef: -0.03, interdit: "1er janvier 2034" },
  { key: "F", label: "F", coef: -0.08, interdit: "1er janvier 2028" },
  { key: "G", label: "G", coef: -0.12, interdit: "1er janvier 2025 (déjà en vigueur)" },
];

const MEUBLE_BONUS = 0.15; // impacte uniquement le loyer, jamais le prix

// Taux de capitalisation indicatifs (méthode reconnue par la Charte de
// l'expertise en évaluation immobilière) pour les locaux commerciaux,
// bureaux et entrepôts/industriel - source : JLL, Qoridor, Trackstone,
// e-locaux/AFREXIM (voir historique du projet). Fourchettes larges et
// volontairement indicatives, à ajuster selon la connaissance du secteur.
const TAUX_CAPITALISATION = {
  commerce: { n1: "4.5", secondaire: "8.5", label: "Local commercial" },
  bureau: { n1: "5", secondaire: "8", label: "Bureau" },
  entrepot: { n1: "7.5", secondaire: "11", label: "Entrepôt / industriel" },
};

// Pourcentages indicatifs du capital emprunté, selon le type de garantie
// (fourchettes de marché 2026 : caution 0,3-1,55 %, hypothèque ~2 %, PPD/HLS
// intermédiaire) — restent modifiables manuellement.
const TYPES_GARANTIE = [
  { key: "caution", label: "Caution (Crédit Logement...)", pct: "1" },
  { key: "hypotheque", label: "Hypothèque conventionnelle", pct: "2" },
  { key: "ppd", label: "PPD / hypothèque légale spéciale", pct: "1.5" },
];

function Field({ label, hint, value, onChange, suffix = "€", step = "1", placeholder }) {
  return (
    <label className="block">
      <div className="flex items-baseline justify-between mb-1">
        <span style={{ fontFamily: "Inter", fontSize: "0.8rem", color: INK, fontWeight: 500 }}>
          {label}
        </span>
        {hint && (
          <span style={{ fontFamily: "Inter", fontSize: "0.7rem", color: "#64748B" }}>{hint}</span>
        )}
      </div>
      <div
        className="flex items-center rounded-lg overflow-hidden"
        style={{ border: `1px solid ${LINE}`, background: "#FFFFFF" }}
      >
        <input
          type="number"
          inputMode="decimal"
          step={step}
          value={value}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
          className="w-full bg-transparent outline-none px-3 py-2"
          style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.95rem", color: INK }}
        />
        <span
          className="px-3 py-2 select-none"
          style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.85rem", color: "#64748B", borderLeft: `1px solid ${LINE}` }}
        >
          {suffix}
        </span>
      </div>
    </label>
  );
}

function TextField({ label, hint, value, onChange, placeholder, onBlur }) {
  return (
    <label className="block">
      <div className="flex items-baseline justify-between mb-1">
        <span style={{ fontFamily: "Inter", fontSize: "0.8rem", color: INK, fontWeight: 500 }}>

        </span>

function CheckChip({ label, checked, onChange }) {
  return (
    <button
      type="button"

        className="inline-flex items-center justify-center rounded-lg shrink-0"
        style={{
          width: 14,
          height: 14,

        {checked && (

function Accordion({ title, subtitle, isOpen, onToggle, children }) {

        type="button"
        onClick={onToggle}

        <span className="flex items-baseline gap-2">
          <span style={{ fontFamily: "Inter", color: GREEN_DARK }} className="text-lg">

              {subtitle}

          style={{

            transform: isOpen ? "rotate(180deg)" : "rotate(0deg)",

      </button>
      {isOpen && (
        <div className="px-5 pb-5 space-y-4" style={{ borderTop: `1px solid ${LINE}`, paddingTop: "1rem" }}>

function LedgerRow({ label, value, subtle, strong }) {

function Simulateur() {
  const [adresse, setAdresse] = useState("");
  const [addressSuggestions, setAddressSuggestions] = useState([]);
  const [addressLoading, setAddressLoading] = useState(false);
  const [addressSelected, setAddressSelected] = useState(false);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const addressDebounceRef = useRef(null);
  const [loyerRefInfo, setLoyerRefInfo] = useState(null);
  const [loyerRefLoading, setLoyerRefLoading] = useState(false);
  const [loyerRefError, setLoyerRefError] = useState(null);
  const [prixRefInfo, setPrixRefInfo] = useState(null);
  const [prixRefLoading, setPrixRefLoading] = useState(false);
  const [prixRefError, setPrixRefError] = useState(null);
  const [vacanceRefInfo, setVacanceRefInfo] = useState(null);
  const [vacanceRefError, setVacanceRefError] = useState(null);
  const [vacanceEstimee, setVacanceEstimee] = useState("");
  const prixCommunesCacheRef = useRef(null);
  const [diagnosticDispersion, setDiagnosticDispersion] = useState(null);
  const [surface, setSurface] = useState("");
  const [pieces, setPieces] = useState("");
  const [departementKey, setDepartementKey] = useState("");
  const [departementsListe, setDepartementsListe] = useState([]);

  useEffect(() => {
    fetch(PRIX_COMMUNES_URL)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data) return;
        prixCommunesCacheRef.current = data;
        if (data._diagnostic_dispersion) setDiagnosticDispersion(data._diagnostic_dispersion);
        const liste = Object.entries(data.departements || {})
          .map(([code, entry]) => ({ code, nom: entry.nom }))
          .sort((a, b) => a.code.localeCompare(b.code));
        setDepartementsListe(liste);
        if (liste.length > 0) setDepartementKey((k) => k || liste[0].code);
      })
      .catch(() => {});
  }, []);
  const [prixM2, setPrixM2] = useState("");
  const [loyerM2, setLoyerM2] = useState("");
  const [etat, setEtat] = useState("bon");
  const [dpe, setDpe] = useState("");
  const [etage, setEtage] = useState("");
  const [dernierEtage, setDernierEtage] = useState(false);
  const [jardinPrivatif, setJardinPrivatif] = useState(false);
  const [meuble, setMeuble] = useState(false);
  const [typeBien, setTypeBien] = useState("appartement"); // "appartement" | "maison" | "local"
  const [sousTypeLocal, setSousTypeLocal] = useState("commerce"); // "commerce" | "bureau" | "entrepot"
  const [emplacementLocal, setEmplacementLocal] = useState("secondaire"); // "n1" | "secondaire"
  const [modePrixLocal, setModePrixLocal] = useState("comparaison"); // "comparaison" | "capitalisation"
  const [loyerAnnuelLocal, setLoyerAnnuelLocal] = useState("");
  const [tauxCapitalisation, setTauxCapitalisation] = useState("8.5");
  const [lastCodeInsee, setLastCodeInsee] = useState(null);
  const [addressCoords, setAddressCoords] = useState(null);
  const [quartierParis, setQuartierParis] = useState(null); // { id, nom } ou null
  const [epoqueConstruction, setEpoqueConstruction] = useState("");
  const [modeLoyer, setModeLoyer] = useState("marche"); // "marche" | "reglementaire"
  const [equipements, setEquipements] = useState({ parking: false, exterieur: false, cave: false, ascenseur: false });

  const [prix, setPrix] = useState("");
  const [prixMode, setPrixMode] = useState("prix"); // "prix" | "rentabilite"
  const [targetNette, setTargetNette] = useState("");
  const [targetNetteExact, setTargetNetteExact] = useState(null);
  const [fraisAgencePct, setFraisAgencePct] = useState("3");
  const [fraisAgenceMode, setFraisAgenceMode] = useState("pct"); // "pct" | "montant"
  const [fraisAgenceCharge, setFraisAgenceCharge] = useState("acquereur");
  const [notairePct, setNotairePct] = useState("7.5");
  const [typeAchat, setTypeAchat] = useState("ancien"); // "ancien" | "neuf"
  const [fraisGarantiePct, setFraisGarantiePct] = useState("1");
  const [typeGarantie, setTypeGarantie] = useState(""); // "" | "caution" | "hypotheque" | "ppd"
  const [fraisGarantieMode, setFraisGarantieMode] = useState("pct"); // "pct" | "montant"
  const [fraisDossierPct, setFraisDossierPct] = useState("1");
  const [fraisDossierMode, setFraisDossierMode] = useState("pct"); // "pct" | "montant"
  const [travaux, setTravaux] = useState("");
  const [revenus, setRevenus] = useState("");
  const [revenusMode, setRevenusMode] = useState("annuel"); // "annuel" | "mensuel"
  const [charges, setCharges] = useState("");
  const [taxeFonciere, setTaxeFonciere] = useState("");
  const [tauxVacance, setTauxVacance] = useState("");

  const [apport, setApport] = useState("");
  const [tauxMode, setTauxMode] = useState("detail"); // "detail" | "global"
  const [tauxInteret, setTauxInteret] = useState("3.5");
  const [dureeAnnees, setDureeAnnees] = useState("20");
  const [tauxAssurance, setTauxAssurance] = useState("0.35");
  const [tauxGlobal, setTauxGlobal] = useState("");

  const [modeUtilisateur, setModeUtilisateur] = useState(() => {
    try {
      return localStorage.getItem("simulateur_mode") || "particulier";
    } catch {
      return "particulier";
    }
  });
  const definirMode = (nouveau) => {
    setModeUtilisateur(nouveau);
    try {
      localStorage.setItem("simulateur_mode", nouveau);
    } catch {}
  };

  const [openSections, setOpenSections] = useState({
    evaluation: false,
    acquisition: false,
    exploitation: false,
    financement: false,
  });
  const toggleSection = (key) =>
    setOpenSections((o) => ({ ...o, [key]: !o[key] }));

  const estimation = useMemo(() => {
    const s = parseNum(surface);
    const pm2 = parseNum(prixM2);
    const loyM2 = parseNum(loyerM2);
    const etatObj = ETATS.find((e) => e.key === etat) || ETATS[1];
    const bonusEquip = EQUIPEMENTS.filter((e) => e.types.includes(typeBien)).reduce(
      (sum, e) => sum + (equipements[e.key] ? e.bonus : 0),
      0
    );
    const dpeObj = DPE_CLASSES.find((d) => d.key === dpe);
    const coefDpe = dpeObj ? dpeObj.coef : 0;
    const bonusMeuble = meuble && typeBien !== "local" ? MEUBLE_BONUS : 0;

    // Coefficient étage : appartements uniquement, impacte le PRIX seulement
    // (convention de marché, pas de donnée officielle chiffrée par commune).
    let coefEtage = 0;
    if (typeBien === "appartement" && etage !== "") {
      const e = parseNum(etage);
      const ascHere = !!equipements.ascenseur;
      if (e === 0) {
        coefEtage = jardinPrivatif ? 0.05 : -0.07; // RDC avec jardin privatif : bonus ; sans : décote
      } else if (e >= 4 && !ascHere) {
        coefEtage = -0.02 * (e - 3); // étages élevés sans ascenseur : décote croissante
      }
      if (dernierEtage && ascHere) {
        coefEtage += 0.07; // dernier étage avec ascenseur : bonus
      }
    }

    const prixParComparaison =
      s > 0 && pm2 > 0 ? s * pm2 * etatObj.coef * (1 + bonusEquip + coefDpe + coefEtage) : 0;
    const loyerAnnuelLocalNum = parseNum(loyerAnnuelLocal);
    const tauxCapNum = parseNum(tauxCapitalisation);
    const prixParCapitalisation =
      loyerAnnuelLocalNum > 0 && tauxCapNum > 0 ? loyerAnnuelLocalNum / (tauxCapNum / 100) : 0;
    const utiliseCapitalisation = typeBien === "local" && modePrixLocal === "capitalisation";
    const prixEstime = utiliseCapitalisation ? prixParCapitalisation : prixParComparaison;
    const loyerMensuelEstime =
      s > 0 && loyM2 > 0 ? s * loyM2 * etatObj.coef * (1 + bonusEquip + coefDpe + bonusMeuble) : 0;
    const loyerAnnuelEstime = loyerMensuelEstime * 12;
    return {
      prixEstime,
      loyerAnnuelEstime,
      loyerMensuelEstime,
      coefEtat: etatObj.coef,
      bonusEquip,
      coefDpe,
      bonusMeuble,
      coefEtage,
      utiliseCapitalisation,
      prixParComparaison,
    };
  }, [
    surface, prixM2, loyerM2, etat, equipements, dpe, meuble, typeBien, etage, dernierEtage,
    jardinPrivatif, modePrixLocal, loyerAnnuelLocal, tauxCapitalisation,
  ]);

  useEffect(() => {
    if (addressSelected) return;
    if (adresse.trim().length < 3) {
      setAddressSuggestions([]);
      setShowSuggestions(false);
      return;
    }
    if (addressDebounceRef.current) clearTimeout(addressDebounceRef.current);
    addressDebounceRef.current = setTimeout(() => {
      setAddressLoading(true);
      fetch(
        `https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(adresse)}&limit=5&index=address`
      )
        .then((r) => r.json())
        .then((data) => {
          setAddressSuggestions(data.features || []);
          setShowSuggestions(true);
        })
        .catch(() => {
          setAddressSuggestions([]);
        })
        .finally(() => setAddressLoading(false));
    }, 300);
    return () => clearTimeout(addressDebounceRef.current);
  }, [adresse, addressSelected]);

  const handleAddressChange = (val) => {
    setAdresse(val);
    setAddressSelected(false);
    setLoyerRefInfo(null);
    setLoyerRefError(null);
    setPrixRefInfo(null);
    setPrixRefError(null);
    setVacanceRefInfo(null);
    setVacanceRefError(null);
    setVacanceEstimee("");
  };

  const fetchLoyerReference = (codeInsee) => {
    if (typeBien === "local") {
      setLoyerRefLoading(false);
      setLoyerM2("");
      setLoyerRefInfo(null);
      setLoyerRefError(
        "La Carte des loyers ne couvre que le logement résidentiel (appartements/maisons) : pas de loyer de référence disponible pour cette catégorie (locaux commerciaux/bureaux/industriels). À estimer manuellement."
      );
      return;
    }

    if (modeLoyer === "reglementaire" && quartierParis && typeBien === "appartement") {
      setLoyerRefLoading(false);
      const data = prixCommunesCacheRef.current;
      const nbP = parseNum(pieces);
      const pieceKey = nbP > 0 ? String(Math.min(Math.round(nbP), 4)) : null;
      const table = data && data.paris_encadrement && data.paris_encadrement.loyers[quartierParis.id];
      const valeurs = table && pieceKey ? table[pieceKey] && table[pieceKey][epoqueConstruction] : null;
      if (!pieceKey || !epoqueConstruction) {
        setLoyerM2("");
        setLoyerRefInfo(null);
        setLoyerRefError("Renseignez le nombre de pièces et l'époque de construction pour le loyer réglementaire.");
        return;
      }
      if (!valeurs) {
        setLoyerM2("");
        setLoyerRefInfo(null);
        setLoyerRefError("Aucune donnée d'encadrement pour cette combinaison pièces/époque dans ce quartier.");
        return;
      }
      setLoyerM2(String(valeurs.ref));
      setLoyerRefInfo({
        commune: quartierParis.nom,
        typo: "réglementaire",
        valeur: valeurs.ref,
        reglementaire: { min: valeurs.min, max: valeurs.max, annee: data.paris_encadrement.annee },
      });
      return;
    }

    setLoyerRefLoading(true);
    setLoyerRefError(null);

    const nbPieces = parseNum(pieces);

    const lookup = (data) => {
      const entry = data[codeInsee];
      const loyers = entry && entry.loyer;
      if (!loyers) {
        setLoyerM2("");
        setLoyerRefInfo(null);
        setLoyerRefError(
          `Aucune donnée de loyer officielle disponible pour les ${typeBien === "maison" ? "maisons" : "appartements"} de cette commune.`
        );
        return;
      }

      let typo, typoLabel;
      if (typeBien === "maison") {
        typo = loyers.maison;
        typoLabel = "maison type";
      } else if (typeBien === "immeuble") {
        typo = loyers.toutes;
        typoLabel = "appartement toutes typologies (approximation, moyenne des logements de l'immeuble)";
      } else if (nbPieces > 0 && nbPieces <= 2 && loyers.t1t2 != null) {
        typo = loyers.t1t2;
        typoLabel = "appartement T1-T2 (petite typologie)";
      } else if (nbPieces >= 3 && loyers.t3plus != null) {
        typo = loyers.t3plus;
        typoLabel = "appartement T3 et plus (grande typologie)";
      } else {
        typo = loyers.toutes;
        typoLabel = "appartement toutes typologies confondues";
      }

      if (!typo || typo.valeur == null) {
        setLoyerM2("");
        setLoyerRefInfo(null);
        setLoyerRefError(
          `Aucune donnée de loyer officielle disponible pour cette typologie dans cette commune.`
        );
        return;
      }

      setLoyerM2(String(typo.valeur));
      setLoyerRefInfo({
        commune: entry.nom,
        typo: typoLabel,
        valeur: typo.valeur,
        nbObs: typo.nb,
        r2: typo.r2,
        fiable: (typo.nb || 0) >= 30 && (typo.r2 || 0) >= 0.5,
      });
    };

    if (prixCommunesCacheRef.current) {
      lookup(prixCommunesCacheRef.current);
      setLoyerRefLoading(false);
      return;
    }

    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(PRIX_COMMUNES_URL)}`;

    fetch(PRIX_COMMUNES_URL)
      .then((r) => {
        if (!r.ok) throw new Error("échec requête directe");
        return r.json();
      })
      .then((data) => {
        prixCommunesCacheRef.current = data;
        lookup(data);
      })
      .catch(() => {
        return fetch(proxyUrl)
          .then((r) => {
            if (!r.ok) throw new Error("échec requête proxy");
            return r.json();
          })
          .then((data) => {
            prixCommunesCacheRef.current = data;
            lookup(data);
          })
          .catch(() => {
            setLoyerRefInfo(null);
            setLoyerRefError("Fichier de loyer par commune momentanément indisponible.");
          });
      })
      .finally(() => setLoyerRefLoading(false));
  };

  const fetchPrixReference = (codeInsee) => {
    setPrixRefLoading(true);
    setPrixRefError(null);

    const lookup = (data) => {
      // Détection du quartier administratif parisien (encadrement des loyers),
      // indépendante du reste - n'a d'effet que si l'adresse tombe dans Paris.
      if (addressCoords && data.paris_encadrement && data.paris_encadrement.quartiers) {
        let trouve = null;
        for (const [qid, q] of Object.entries(data.paris_encadrement.quartiers)) {
          if (pointDansPolygone(addressCoords.lat, addressCoords.lon, q.polygon)) {
            trouve = { id: qid, nom: q.nom };
            break;
          }
        }
        setQuartierParis(trouve);
        if (!trouve) setModeLoyer("marche");
      } else {
        setQuartierParis(null);
        setModeLoyer("marche");
      }

      const entry = data[codeInsee];
      if (!entry) {
        setPrixRefInfo(null);
        setPrixRefError("Aucune donnée DVF trouvée pour cette commune (code " + codeInsee + ").");
        setVacanceRefInfo(null);
        setVacanceRefError(null);
        setVacanceEstimee("");
        return;
      }

      if (typeBien === "local") {
        setVacanceEstimee("");
        setVacanceRefInfo(null);
        setVacanceRefError(
          "LOVAC ne couvre que le logement résidentiel : pas de taux de vacance de référence disponible pour cette catégorie (locaux commerciaux/bureaux/industriels). À estimer manuellement."
        );
      } else if (entry.vacance) {
        setVacanceEstimee(String(entry.vacance.taux));
        setVacanceRefInfo({ commune: entry.nom, taux: entry.vacance.taux, millesime: entry.vacance.millesime, mixte: true });
        setVacanceRefError(null);
      } else {
        setVacanceEstimee("");
        setVacanceRefInfo(null);
        setVacanceRefError("Aucune donnée de vacance disponible pour cette commune (LOVAC).");
      }

      const nbPieces = parseNum(pieces);
      let source, typeUtilise, fiabiliteTypo = null, niveauUtilise = null;
      const typoKey = nbPieces > 0 ? (nbPieces <= 2 ? "t1t2" : "t3plus") : null;

      // 1) Secteur géographique fin (300m -> 500m -> 1km), + typologie
      if (typeBien === "appartement" && typoKey && addressCoords && data.secteurs) {
        for (const taille of RESOLUTIONS_SECTEUR) {
          const cell = gridId(addressCoords.lat, addressCoords.lon, taille);
          const secteur = data.secteurs[String(taille)] && data.secteurs[String(taille)][cell];
          const typo = secteur && secteur[typoKey];
          if (typo) {
            source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
            typeUtilise = (typoKey === "t1t2" ? "appartements T1-T2" : "appartements T3 et plus") + ` (secteur ${taille}m)`;
            fiabiliteTypo = { fiable: true, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
            niveauUtilise = "secteur";
            break;
          }
        }
      }

      // 1bis) Secteur géographique fin pour les maisons (pas de typologie)
      if (!source && typeBien === "maison" && addressCoords && data.secteurs) {
        for (const taille of RESOLUTIONS_SECTEUR) {
          const cell = gridId(addressCoords.lat, addressCoords.lon, taille);
          const secteur = data.secteurs[String(taille)] && data.secteurs[String(taille)][cell];
          const typo = secteur && secteur["maison"];
          if (typo) {
            source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
            typeUtilise = `maisons (secteur ${taille}m)`;
            fiabiliteTypo = { fiable: true, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
            niveauUtilise = "secteur";
            break;
          }
        }
      }

      // 1ter) Secteur géographique fin pour les immeubles (pas de typologie)
      if (!source && typeBien === "immeuble" && addressCoords && data.secteurs) {
        for (const taille of RESOLUTIONS_SECTEUR) {
          const cell = gridId(addressCoords.lat, addressCoords.lon, taille);
          const secteur = data.secteurs[String(taille)] && data.secteurs[String(taille)][cell];
          const typo = secteur && secteur["immeuble"];
          if (typo) {
            source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
            typeUtilise = `immeubles (secteur ${taille}m)`;
            fiabiliteTypo = { fiable: true, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
            niveauUtilise = "secteur";
            break;
          }
        }
      }

      // 2) Commune + typologie
      if (!source && typeBien === "appartement" && typoKey && entry.appartement_typologie) {
        const typo = entry.appartement_typologie[typoKey];
        if (typo) {
          source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
          typeUtilise = typoKey === "t1t2" ? "appartements T1-T2" : "appartements T3 et plus";
          fiabiliteTypo = { fiable: typo.fiable, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
          niveauUtilise = "commune";
        }
      }

      // 2bis) Commune pour les immeubles (pas de typologie, pas de fusion -
      // aucune autre source n'existe pour cette catégorie)
      if (!source && typeBien === "immeuble" && entry.immeuble) {
        const typo = entry.immeuble;
        source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
        typeUtilise = "immeubles (commune)";
        fiabiliteTypo = { fiable: typo.fiable, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
        niveauUtilise = "commune";
      }

      // 3) Commune fusionné (toutes typologies) / maison / local
      if (!source && typeBien !== "immeuble") {
        source =
          typeBien === "local"
            ? entry.local
            : typeBien === "maison"
            ? entry.maison || entry.appartement
            : entry.appartement || entry.maison;
        if (source) niveauUtilise = niveauUtilise || "commune";
      }

      // 4) Repli département (typologie, puis fusionné), uniquement si la
      // commune elle-même n'a rien donné du tout.
      if (!source && departementKey) {
        const dept = data.departements && data.departements[departementKey];
        if (dept) {
          if (typeBien === "appartement" && typoKey && dept.appartement_typologie && dept.appartement_typologie[typoKey]) {
            const typo = dept.appartement_typologie[typoKey];
            source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
            typeUtilise = (typoKey === "t1t2" ? "appartements T1-T2" : "appartements T3 et plus") + " (département)";
            fiabiliteTypo = { fiable: typo.fiable, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
          } else if (typeBien === "immeuble" && dept.immeuble) {
            const typo = dept.immeuble;
            source = { nb: typo.nb, mediane: typo.mediane, moyenne: null };
            typeUtilise = "immeubles (département)";
            fiabiliteTypo = { fiable: typo.fiable, fenetreAnnees: typo.fenetre_annees, marge: typo.marge };
          } else if (typeBien !== "immeuble") {
            source =
              typeBien === "local"
                ? dept.local
                : typeBien === "maison"
                ? dept.maison || dept.appartement
                : dept.appartement || dept.maison;
            if (source) {
              const baseLabel =
                typeBien === "local"
                  ? "locaux commerciaux/bureaux/industriels"
                  : typeBien === "maison"
                  ? dept.maison
                    ? "maisons"
                    : "appartements"
                  : dept.appartement
                  ? "appartements (toutes typologies)"
                  : "maisons";
              typeUtilise = baseLabel + " (département)";
            }
          }
        }
      }
      if (!source) {
        setPrixRefInfo(null);
        setPrixRefError(
          typeBien === "local"
            ? "Pas assez de ventes de locaux commerciaux/bureaux/industriels enregistrées (DVF) pour cette commune."
            : typeBien === "immeuble"
            ? "Pas assez de ventes d'immeubles enregistrées (DVF) pour cette commune ou ce département."
            : "Pas assez de ventes enregistrées (DVF) pour cette commune."
        );
        return;
      }
      if (!typeUtilise) {
        typeUtilise =
          typeBien === "local"
            ? "locaux commerciaux/bureaux/industriels"
            : typeBien === "maison"
            ? entry.maison
              ? "maisons"
              : "appartements"
            : entry.appartement
            ? "appartements (toutes typologies)"
            : "maisons";
      }
      setPrixM2(String(source.mediane));
      setPrixRefInfo({
        commune: entry.nom,
        nb: source.nb,
        moyenne: source.moyenne,
        mediane: source.mediane,
        type: typeUtilise,
        fiabiliteTypo,
      });
    };

    if (prixCommunesCacheRef.current) {
      lookup(prixCommunesCacheRef.current);
      setPrixRefLoading(false);
      return;
    }

    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(PRIX_COMMUNES_URL)}`;

    fetch(PRIX_COMMUNES_URL)
      .then((r) => {
        if (!r.ok) throw new Error("échec requête directe");
        return r.json();
      })
      .then((data) => {
        prixCommunesCacheRef.current = data;
        lookup(data);
      })
      .catch(() => {
        // Repli via proxy CORS si l'appel direct échoue (en-têtes CORS manquants côté hébergeur)
        return fetch(proxyUrl)
          .then((r) => {
            if (!r.ok) throw new Error("échec requête proxy");
            return r.json();
          })
          .then((data) => {
            prixCommunesCacheRef.current = data;
            lookup(data);
          })
          .catch(() => {
            setPrixRefInfo(null);
            setPrixRefError("Fichier de prix par commune momentanément indisponible (y compris via le relais de secours).");
          });
      })
      .finally(() => setPrixRefLoading(false));
  };

  const handleSelectAddress = (feature) => {
    const props = feature.properties || {};
    setAdresse(props.label || adresse);
    setAddressSelected(true);
    setShowSuggestions(false);
    setAddressSuggestions([]);

    const coords = feature.geometry && feature.geometry.coordinates;
    if (coords && coords.length === 2) {
      setAddressCoords({ lat: coords[1], lon: coords[0] });
    } else {
      setAddressCoords(null);
    }

    if (props.citycode) {
      const deptCode = codeToDept(props.citycode);
      if (deptCode) setDepartementKey(deptCode);
      setLastCodeInsee(props.citycode);
      fetchLoyerReference(props.citycode);
      fetchPrixReference(props.citycode);
    }
  };

  useEffect(() => {
    if (lastCodeInsee) {
      fetchLoyerReference(lastCodeInsee);
      fetchPrixReference(lastCodeInsee);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [typeBien]);

  useEffect(() => {
    if (lastCodeInsee) {
      fetchLoyerReference(lastCodeInsee);
      fetchPrixReference(lastCodeInsee);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pieces]);

  useEffect(() => {
    if (lastCodeInsee) {
      fetchLoyerReference(lastCodeInsee);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [modeLoyer, epoqueConstruction]);

  useEffect(() => {
    if (parseNum(loyerAnnuelLocal) > 0) {
      setModePrixLocal("capitalisation");
    }
  }, [loyerAnnuelLocal]);

  const calc = useMemo(() => {
    const fapct = parseNum(fraisAgencePct);
    const npct = parseNum(notairePct);
    const trx = parseNum(travaux);
    const rev = parseNum(revenus);
    const chg = parseNum(charges);
    const tf = parseNum(taxeFonciere);
    const tvac = parseNum(tauxVacance);
    const perteVacance = rev * (tvac / 100);
    const revEffectif = rev - perteVacance;
    const revenuNetAnnuel = revEffectif - chg - tf;

    // coût total = p * k + trx, où k dépend du régime des frais d'agence
    // Les frais d'agence s'ajoutent toujours au prix net vendeur ; seule la base
    // de calcul des frais de notaire diffère selon qui les prend en charge.
    const k =
      fraisAgenceCharge === "vendeur"
        ? (1 + fapct / 100) * (1 + npct / 100)
        : 1 + fapct / 100 + npct / 100;

    const target = targetNetteExact !== null ? targetNetteExact : parseNum(targetNette);
    let p;
    let impossible = false;
    if (prixMode === "rentabilite") {
      if (target > 0 && revenuNetAnnuel > 0 && k > 0) {
        const targetCoutTotal = (revenuNetAnnuel * 100) / target;
        p = Math.max(0, (targetCoutTotal - trx) / k);
      } else {
        p = 0;
        impossible = true;
      }
    } else {
      p = parseNum(prix);
    }

    const fa = (p * fapct) / 100;
    const baseNotaire = fraisAgenceCharge === "vendeur" ? p + fa : p;
    const fraisNotaire = (baseNotaire * npct) / 100;
    const coutTotal = p + fa + fraisNotaire + trx;

    const brute = coutTotal > 0 ? (rev / coutTotal) * 100 : 0;
    const nette = coutTotal > 0 ? (revenuNetAnnuel / coutTotal) * 100 : 0;

    // Financement
    const ap = parseNum(apport);
    const duree = parseNum(dureeAnnees);
    // En mode "taux global", le taux saisi couvre intérêt + assurance et est
    // appliqué directement dans la formule d'annuité ; l'assurance n'est alors
    // plus calculée séparément (elle est déjà incluse dans ce taux global).
    const tauxAnnuel = tauxMode === "global" ? parseNum(tauxGlobal) : parseNum(tauxInteret);
    const tAssurance = tauxMode === "global" ? 0 : parseNum(tauxAssurance);

    const capitalEmprunte = Math.max(coutTotal - ap, 0);
    const nMois = Math.max(Math.round(duree * 12), 0);
    const tauxMensuel = tauxAnnuel / 100 / 12;

    let mensualiteCredit = 0;
    if (nMois > 0) {
      mensualiteCredit =
        tauxMensuel > 0
          ? (capitalEmprunte * tauxMensuel) / (1 - Math.pow(1 + tauxMensuel, -nMois))
          : capitalEmprunte / nMois;
    }
    const assuranceMensuelle = (capitalEmprunte * tAssurance) / 100 / 12;
    const mensualiteTotale = mensualiteCredit + assuranceMensuelle;
    const remboursementAnnuel = mensualiteTotale * 12;
    const interetsTotaux = mensualiteCredit * nMois - capitalEmprunte;
    const assuranceTotale = assuranceMensuelle * nMois;
    const montantGarantie = (capitalEmprunte * parseNum(fraisGarantiePct)) / 100;
    const montantFraisDossier = (capitalEmprunte * parseNum(fraisDossierPct)) / 100;
    const coutTotalCredit = interetsTotaux + assuranceTotale + montantGarantie + montantFraisDossier;

    const cashflowAnnuelApresFinancement = revenuNetAnnuel - remboursementAnnuel;
    const cashflowMensuelApresFinancement = cashflowAnnuelApresFinancement / 12;
    const rendementFondsPropres = ap > 0 ? (cashflowAnnuelApresFinancement / ap) * 100 : null;
    const creditRenseigne = ap > 0 && nMois > 0;

    return {
      p, fa, baseNotaire, fraisNotaire, trx, coutTotal,
      rev, chg, tf, tvac, perteVacance, revEffectif, revenuNetAnnuel, brute, nette, impossible,
      cashflowMensuel: revenuNetAnnuel / 12,
      ap, capitalEmprunte, nMois, mensualiteCredit, assuranceMensuelle, mensualiteTotale,
      remboursementAnnuel, interetsTotaux, assuranceTotale, montantGarantie, montantFraisDossier, coutTotalCredit,
      cashflowAnnuelApresFinancement, cashflowMensuelApresFinancement, rendementFondsPropres,
      creditRenseigne,
    };
  }, [
    prix, prixMode, targetNette, targetNetteExact, fraisAgencePct, fraisAgenceCharge, notairePct,
    travaux, revenus, charges, taxeFonciere, tauxVacance, apport, tauxMode, tauxInteret, tauxGlobal, dureeAnnees, tauxAssurance,
    fraisGarantiePct, fraisDossierPct,
  ]);

  const tier = tierFor(calc.nette);

  useEffect(() => {
    if (calc.p > 0) {
      setOpenSections((o) => (o.exploitation ? o : { ...o, exploitation: true }));
    }
  }, [calc.p > 0]);

  useEffect(() => {
    if (calc.creditRenseigne) {
      setOpenSections((o) => (o.financement ? o : { ...o, financement: true }));
    }
  }, [calc.creditRenseigne]);

  // Synchronisation bidirectionnelle prix <-> rentabilité nette visée
  useEffect(() => {
    if (prixMode === "rentabilite") {
      setPrix(calc.p > 0 ? String(Math.round(calc.p)) : "");
    }
  }, [calc.p, prixMode]);

  useEffect(() => {
    if (prixMode === "prix") {
      if (calc.nette > 0) {
        setTargetNette(calc.nette.toFixed(2));
        setTargetNetteExact(calc.nette);
      } else {
        setTargetNette("");
        setTargetNetteExact(null);
      }
    }
  }, [calc.nette, prixMode]);

  const contentRef = useRef(null);
  const [pdfBusy, setPdfBusy] = useState(false);

  const handleSavePdf = () => {
    if (typeof window === "undefined" || typeof window.html2pdf === "undefined") {
      // Solution de repli si html2pdf n'est pas disponible dans cet environnement
      window.print();
      return;
    }
    setPdfBusy(true);
    const opt = {
      margin: 10,
      filename: "simulateur-rentabilite-locative.pdf",
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: {
        scale: 2,
        onclone: (doc) => {
          doc.querySelectorAll(".no-print").forEach((el) => {
            el.style.display = "none";
          });
        },
      },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    };
    window
      .html2pdf()
      .set(opt)
      .from(contentRef.current)
      .save()
      .then(() => {
        setPdfBusy(false);
      })
      .catch(() => {
        setPdfBusy(false);
      });
  };

  return (
    <div ref={contentRef} style={{ background: PAPER, minHeight: "100vh" }} className="w-full">
      <style>{PRINT_STYLES}</style>
      <div className="max-w-5xl mx-auto px-5 py-10 md:py-14">
        {/* Header */}
        <div className="no-print flex gap-2 mb-4">
          <button
            type="button"

                          setTypeGarantie(g.key);
                          setFraisGarantiePct(g.pct);
                          setFraisGarantieMode("pct");
                        }}
                        className="rounded-lg py-2 px-1"
                        style={{
                          fontFamily: "Inter", fontSize: "0.72rem",
                          border: `1px solid ${LINE}`,
                          background: typeGarantie === g.key ? GREEN_DARK : "#FFFFFF",
                          color: typeGarantie === g.key ? "#FFFFFF" : INK,
                        }}
                      >
                        {g.label}
                      </button>
                    ))}
                  </div>
                  {modeUtilisateur === "pro" && (
<p style={{ fontFamily: "Inter", fontSize: "0.68rem", color: "#64748B" }} className="mt-1">
                    Pré-remplit le pourcentage indicatif ci-dessous (marché 2026) — reste modifiable
                    manuellement ; la caution garantit aujourd'hui plus d'un prêt sur deux en France.
                  </p>
)}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <div className="flex items-baseline justify-between mb-1">
                      <span style={{ fontFamily: "Inter", fontSize: "0.8rem", color: INK, fontWeight: 500 }}>
                        Frais de garantie
                      </span>
                    </div>
                    <div className="flex gap-2">
                      <div className="flex-1">
                        <div
                          className="flex items-center rounded-lg overflow-hidden"
                          style={{ border: `1px solid ${LINE}`, background: "#FFFFFF" }}
                        >
                          <input
                            type="number"
                            step={fraisGarantieMode === "pct" ? "0.1" : "1"}
                            value={
                              fraisGarantieMode === "pct"
                                ? fraisGarantiePct
                                : Math.round(calc.montantGarantie).toString()
                            }
                            onChange={(e) => {
                              if (fraisGarantieMode === "pct") {
                                setFraisGarantiePct(e.target.value);
                              } else {
                                const montant = parseNum(e.target.value);
                                const capital = calc.capitalEmprunte;
                                setFraisGarantiePct(capital > 0 ? String((montant / capital) * 100) : "0");
                              }
                            }}
                            className="w-full bg-transparent outline-none px-3 py-2"
                            style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.95rem", color: INK }}
                          />
                          <span
                            className="px-3 py-2"
                            style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.85rem", color: "#64748B", borderLeft: `1px solid ${LINE}` }}
                          >
                            {fraisGarantieMode === "pct" ? "%" : "€"}
                          </span>
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => setFraisGarantieMode((m) => (m === "pct" ? "montant" : "pct"))}
                        title="Basculer entre pourcentage et montant"
                        aria-label="Basculer entre pourcentage et montant"
                        className="no-print flex items-center justify-center rounded-lg shrink-0"
                        style={{ width: 38, border: `1px solid ${LINE}`, background: "#FFFFFF", color: GREEN_DARK }}
                      >
                        <ArrowLeftRight size={15} strokeWidth={1.75} />
                      </button>
                    </div>
                    {modeUtilisateur === "pro" && (
<p style={{ fontFamily: "Inter", fontSize: "0.68rem", color: "#64748B" }} className="mt-1">
                      {fraisGarantieMode === "pct"
                        ? `Soit ${euro(calc.montantGarantie)}`
                        : `Soit ${pct(parseNum(fraisGarantiePct))} du capital emprunté`}
                    </p>
)}
                  </div>
                  <div>
                    <div className="flex items-baseline justify-between mb-1">
                      <span style={{ fontFamily: "Inter", fontSize: "0.8rem", color: INK, fontWeight: 500 }}>
                        Frais de dossier
                      </span>
                    </div>
                    <div className="flex gap-2">
                      <div className="flex-1">
                        <div
                          className="flex items-center rounded-lg overflow-hidden"
                          style={{ border: `1px solid ${LINE}`, background: "#FFFFFF" }}
                        >
                          <input
                            type="number"
                            step={fraisDossierMode === "pct" ? "0.1" : "1"}
                            value={
                              fraisDossierMode === "pct"
                                ? fraisDossierPct
                                : Math.round(calc.montantFraisDossier).toString()
                            }
                            onChange={(e) => {
                              if (fraisDossierMode === "pct") {
                                setFraisDossierPct(e.target.value);
                              } else {
                                const montant = parseNum(e.target.value);
                                const capital = calc.capitalEmprunte;
                                setFraisDossierPct(capital > 0 ? String((montant / capital) * 100) : "0");
                              }
                            }}
                            className="w-full bg-transparent outline-none px-3 py-2"
                            style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.95rem", color: INK }}
                          />
                          <span
                            className="px-3 py-2"
                            style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.85rem", color: "#64748B", borderLeft: `1px solid ${LINE}` }}
                          >
                            {fraisDossierMode === "pct" ? "%" : "€"}
                          </span>
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => setFraisDossierMode((m) => (m === "pct" ? "montant" : "pct"))}
                        title="Basculer entre pourcentage et montant"
                        aria-label="Basculer entre pourcentage et montant"
                        className="no-print flex items-center justify-center rounded-lg shrink-0"
                        style={{ width: 38, border: `1px solid ${LINE}`, background: "#FFFFFF", color: GREEN_DARK }}
                      >
                        <ArrowLeftRight size={15} strokeWidth={1.75} />
                      </button>
                    </div>
                    {modeUtilisateur === "pro" && (
<p style={{ fontFamily: "Inter", fontSize: "0.68rem", color: "#64748B" }} className="mt-1">
                      {fraisDossierMode === "pct"
                        ? `Soit ${euro(calc.montantFraisDossier)} — plafond légal : 1 % du capital emprunté (art. R313-7 du Code de la consommation)`
                        : `Soit ${pct(parseNum(fraisDossierPct))} du capital emprunté`}
                    </p>
)}
                  </div>
                </div>
            </Accordion>
          </div>

          {/* Résultats - relevé de calcul */}
          <div className="md:col-span-2">
            <div className="md:sticky md:top-6 space-y-4">
              {calc.coutTotal > 0 && (
                <div
                  className="p-6"
                  style={{ background: GREEN_DARK, border: `1px solid ${GREEN}`, borderRadius: 12 }}
                >
                  <div
                    style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.68rem", letterSpacing: "0.16em", color: "#BFDBFE" }}
                    className="uppercase mb-3"
                  >
                    Rentabilité nette de charges
                  </div>
                  <div className="flex items-end gap-3 mb-1">
                    <span
                      style={{ fontFamily: "Inter", fontWeight: 500, color: "#FFFFFF", fontSize: "3rem", lineHeight: 1 }}
                    >
                      {pct(calc.nette)}
                    </span>
                  </div>
                  <div className="flex items-center gap-2 mt-3">
                    <span
                      className="inline-block rounded-full"
                      style={{
                        fontFamily: "Inter", fontSize: "0.72rem", fontWeight: 600,
                        padding: "3px 10px",
                        background: "rgba(255,255,255,0.15)",
                        color: "#FFFFFF",
                      }}
                    >
                      {tier.label}
                    </span>
                    <span style={{ fontFamily: "Inter", fontSize: "0.75rem", color: "#94A3B8" }} className="ml-auto">
                      Brute : {pct(calc.brute)}
                    </span>
                  </div>
                  <div style={{ height: 3, borderRadius: 2, background: tier.color, marginTop: 10, opacity: 0.9 }} />
                </div>
              )}

              {calc.coutTotal > 0 && (
                <div
                  className="p-6"
                  style={{ background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: 12 }}
                >
                  <h3
                    style={{ fontFamily: "Inter", color: GREEN_DARK }}
                    className="text-base mb-3"
                  >
                    Coût total de l'investissement
                  </h3>
                  <LedgerRow label="Prix net vendeur" value={euro(calc.p)} />
                  <LedgerRow label="Frais d'agence" value={euro(calc.fa)} />
                  <LedgerRow label={`Frais de notaire (${parseNum(notairePct)}% sur ${euro(calc.baseNotaire)})`} value={euro(calc.fraisNotaire)} />
                  <LedgerRow label="Travaux" value={euro(calc.trx)} />
                  <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${LINE}` }}>
                    <LedgerRow label="Coût total" value={euro(calc.coutTotal)} strong />
                  </div>
                </div>
              )}

              {calc.coutTotal > 0 && (
                <div
                  className="p-6"
                  style={{ background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: 12 }}
                >
                  <h3
                    style={{ fontFamily: "Inter", color: GREEN_DARK }}
                    className="text-base mb-3"
                  >
                    Résultat annuel
                  </h3>
                  <LedgerRow label="Revenus locatifs" value={euro(calc.rev)} />
                  {calc.tvac > 0 && (
                    <LedgerRow
                      label={`Perte pour vacance locative (${pct(calc.tvac)})`}
                      value={"– " + euro(calc.perteVacance)}
                      subtle
                    />
                  )}
                  <LedgerRow label="Charges non récupérables" value={"– " + euro(calc.chg)} subtle />
                  <LedgerRow label="Taxe foncière" value={"– " + euro(calc.tf)} subtle />
                  <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${LINE}` }}>
                    <LedgerRow label="Revenu net annuel" value={euro(calc.revenuNetAnnuel)} strong />
                    <LedgerRow label="Cash-flow mensuel" value={euro(calc.cashflowMensuel)} />
                  </div>
                  {modeUtilisateur === "pro" && (
<p style={{ fontFamily: "Inter", fontSize: "0.68rem", color: "#64748B" }} className="mt-3">
                    Hors crédit, assurance emprunteur et fiscalité sur les revenus fonciers.
                  </p>
)}
                </div>
              )}

              {calc.creditRenseigne && (
                <div
                  className="p-6"
                  style={{ background: GREEN_DARK, border: `1px solid ${GREEN}`, borderRadius: 12 }}
                >
                  <div
                    style={{ fontFamily: "Inter", fontVariantNumeric: "tabular-nums", fontSize: "0.68rem", letterSpacing: "0.16em", color: "#BFDBFE" }}
                    className="uppercase mb-3"
                  >
                    Cash-flow mensuel après crédit
                  </div>
                  <div className="flex items-end gap-3 mb-1">
                    <span
                      style={{
                        fontFamily: "Inter",
                        fontWeight: 500,
                        color: calc.cashflowMensuelApresFinancement >= 0 ? "#FFFFFF" : "#FCA5A5",
                        fontSize: "3rem",
                        lineHeight: 1,
                      }}
                    >
                      {euro(calc.cashflowMensuelApresFinancement)}
                    </span>
                  </div>
                  <div className="flex items-center gap-2 mt-3">
                    <span style={{ fontFamily: "Inter", fontSize: "0.78rem", color: "#CBD5E1" }}>
                      {calc.rendementFondsPropres === null
                        ? "Sans apport, non calculable"
                        : `Rendement sur apport : ${pct(calc.rendementFondsPropres)}`}
                    </span>
                  </div>
                </div>
              )}

              {calc.creditRenseigne && (
                <div
                  className="p-6"
                  style={{ background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: 12 }}
                >
                  <h3
                    style={{ fontFamily: "Inter", color: GREEN_DARK }}
                    className="text-base mb-3"
                  >
                    Financement
                  </h3>
                  <LedgerRow label="Coût total à financer" value={euro(calc.coutTotal)} />
                  <LedgerRow label="Apport" value={"– " + euro(calc.ap)} subtle />
                  <LedgerRow label="Capital emprunté" value={euro(calc.capitalEmprunte)} strong />
                  <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${LINE}` }}>
                    <LedgerRow
                      label={tauxMode === "global" ? "Mensualité (taux global)" : "Mensualité crédit"}
                      value={euro(calc.mensualiteCredit)}
                    />
                    {tauxMode === "detail" && (
                      <LedgerRow label="Assurance emprunteur" value={euro(calc.assuranceMensuelle)} />
                    )}
                    <LedgerRow label="Mensualité totale" value={euro(calc.mensualiteTotale)} strong />
                  </div>
                  <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${LINE}` }}>
                    <LedgerRow
                      label={tauxMode === "global" ? "Coût du crédit (intérêt + assurance)" : "Intérêts sur la durée"}
                      value={euro(calc.interetsTotaux)}
                    />
                    {tauxMode === "detail" && (
                      <LedgerRow label="Assurance sur la durée" value={euro(calc.assuranceTotale)} />
                    )}
                    <LedgerRow label="Frais de garantie (caution/hypothèque)" value={euro(calc.montantGarantie)} />
                    <LedgerRow label="Frais de dossier" value={euro(calc.montantFraisDossier)} />
                    <LedgerRow label="Coût total du crédit" value={euro(calc.coutTotalCredit)} strong />
                  </div>
                  <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${LINE}` }}>
                    <LedgerRow label="Revenu net annuel" value={euro(calc.revenuNetAnnuel)} />
                    <LedgerRow label="Remboursement annuel" value={"– " + euro(calc.remboursementAnnuel)} subtle />
                    <LedgerRow label="Cash-flow annuel après crédit" value={euro(calc.cashflowAnnuelApresFinancement)} strong />
                  </div>
                  {modeUtilisateur === "pro" && (
<p style={{ fontFamily: "Inter", fontSize: "0.68rem", color: "#64748B" }} className="mt-3">
                    Hors fiscalité sur les revenus fonciers et évolution de la valeur du bien.
                  </p>
)}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Simulateur />);
</script>
</body>
</html>
